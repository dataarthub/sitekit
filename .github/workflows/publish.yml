name: "Publish npm packages"
run-name: "${{ inputs.recover_release != '' && format('Recover {0}', inputs.recover_release) || github.event_name == 'workflow_dispatch' && format('Complete npm staging run {0}', inputs.staged_run) || format('Stage npm Release {0}', github.event.release.tag_name) }}"
on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      staged_run:
        description: "Original successful staging run ID after human npm approval"
        required: false
        type: "string"
      recover_release:
        description: "Reviewed fixed candidate whose original run stopped before archive creation or staging"
        type: "choice"
        required: false
        default: ""
        options:
          - ""
          - "core-0.2.0"
permissions:
  contents: "read"
env:
  RELEASE_REPOSITORY_PRIVATE: "${{ github.event.repository.private }}"
concurrency:
  group: "sitekit-npm-release"
  cancel-in-progress: false
jobs:
  verify:
    if: |
      (github.event_name == 'release' && github.repository == 'dataarthub/sitekit' && github.event.release.draft == false && github.event.release.prerelease == false && (github.event_name == 'release' && github.repository == 'dataarthub/sitekit' && github.event.release.draft == false && github.event.release.prerelease == false && (startsWith(github.event.release.tag_name, 'sitekit-core-v') ||
       startsWith(github.event.release.tag_name, 'sitekit-cloudflare-v')))) || (github.event_name == 'workflow_dispatch' && github.repository == 'dataarthub/sitekit' && github.ref == 'refs/heads/main' && inputs.recover_release != '' && inputs.staged_run == '')
    runs-on: "ubuntu-latest"
    timeout-minutes: 25
    outputs:
      artifact: "${{ steps.upload.outputs.artifact-id }}"
      source: "${{ steps.candidate.outputs.source }}"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          path: "control"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Resolve fixed package source with maintained control code"
        run: "node control/scripts/release-source-proof.mjs select"
        id: "candidate"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        working-directory: "${{ github.workspace }}"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ steps.candidate.outputs.source }}"
          path: "source"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        name: "Project: Resolve original Changesets base"
        run: "git update-ref refs/heads/main refs/remotes/origin/main"
      -
        uses: "oven-sh/setup-bun@v2"
        with:
          bun-version: "1.4.0"
        name: "Shared: oven-sh/setup-bun@v2"
      -
        name: "Project: Set up reviewed release npm"
        run: "npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org"
      -
        name: "Project: Restore original locked dependencies"
        run: "bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org"
      -
        name: "Project: Set up original safety tools"
        run: "bun run quality:setup"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 26
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Authenticate source and execute fresh Node 26 checks"
        run: "node ../control/scripts/release-source-proof.mjs fresh"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Authenticate source and execute fresh Node 24 checks"
        run: "node ../control/scripts/release-source-proof.mjs fresh"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
      -
        name: "Project: Prepare and test exact release archives"
        run: "node ../control/scripts/release-bundle.mjs prepare --targets \"$SELECTED_TARGETS\" --output-dir .verification/handoff"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          SELECTED_TARGETS: "${{ steps.candidate.outputs.kind }}"
      -
        uses: "actions/upload-artifact@v4"
        id: "upload"
        with:
          name: "verified-npm-release-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            source/.verification/handoff/release.json
            source/.verification/handoff/*.tgz
            source/.verification/handoff/*.notes.md
          if-no-files-found: "error"
          include-hidden-files: true
          retention-days: 14
        name: "Shared: actions/upload-artifact@v4"
    permissions:
      contents: "read"
      actions: "read"
    defaults:
      run:
        working-directory: "source"
    env:
      PUBLISH_PACKAGE_ROOT: "${{ github.workspace }}/source"
      RECOVER_RELEASE: "${{ inputs.recover_release }}"
  stage:
    needs: "verify"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
      actions: "read"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          path: "control"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ needs.verify.outputs.source }}"
          path: "source"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Set up reviewed OIDC npm"
        run: "npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org"
      -
        uses: "actions/download-artifact@v8"
        with:
          artifact-ids: "${{ needs.verify.outputs.artifact }}"
          path: "source/.verification/handoff"
          digest-mismatch: "error"
        name: "Shared: actions/download-artifact@v8"
      -
        name: "Project: Authenticate original source and fresh producer proof"
        run: "node ../control/scripts/release-source-proof.mjs writer"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
      -
        name: "Project: Revalidate live Release identity and submit exact verified archives"
        run: "node ../control/scripts/release-publish.mjs stage --bundle .verification/handoff"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
    defaults:
      run:
        working-directory: "source"
    env:
      PUBLISH_PACKAGE_ROOT: "${{ github.workspace }}/source"
      RECOVER_RELEASE: "${{ inputs.recover_release }}"
  resolve:
    if: "github.event_name == 'workflow_dispatch' && github.repository == 'dataarthub/sitekit' && github.ref == 'refs/heads/main' && inputs.recover_release == '' && inputs.staged_run != ''"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    permissions:
      contents: "read"
      actions: "read"
    outputs:
      run: "${{ steps.original.outputs.run }}"
      artifact: "${{ steps.original.outputs.artifact }}"
      commit: "${{ steps.original.outputs.commit }}"
    steps:
      -
        name: "Project: Require trusted default branch"
        run: "test \"$GITHUB_REF\" = refs/heads/main"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          path: "control"
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Resolve original successful staging attempt and immutable artifact"
        id: "original"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
        run: "mkdir -p .verification && node control/scripts/release-evidence.mjs"
  complete:
    needs: "resolve"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      actions: "read"
      id-token: "write"
      deployments: "write"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          path: "control"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ needs.resolve.outputs.commit }}"
          path: "source"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
          check-latest: true
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Set up reviewed OIDC npm"
        run: "npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org"
      -
        name: "Project: Revalidate original successful producer before handoff"
        run: "mkdir -p .verification && node ../control/scripts/release-evidence.mjs"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
      -
        uses: "actions/download-artifact@v8"
        with:
          artifact-ids: "${{ needs.resolve.outputs.artifact }}"
          run-id: "${{ needs.resolve.outputs.run }}"
          github-token: "${{ github.token }}"
          path: "source/.verification/handoff"
          digest-mismatch: "error"
        name: "Shared: actions/download-artifact@v8"
      -
        name: "Project: Authenticate original source and fresh producer proof"
        run: "node ../control/scripts/release-source-proof.mjs writer"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
      -
        name: "Project: Verify approved public bytes, repair channels and record original-SHA success"
        run: "node ../control/scripts/release-publish.mjs complete --bundle .verification/handoff"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
    env:
      PUBLISH_SOURCE_SHA: "${{ needs.resolve.outputs.commit }}"
      STAGED_RUN: "${{ inputs.staged_run }}"
      PUBLISH_PACKAGE_ROOT: "${{ github.workspace }}/source"
    defaults:
      run:
        working-directory: "source"
