# Bundle SHA-256: 8c36f617e0b10cc15e3bf514e3bb6fb12b6da91d3da5d8e1b8f20c4bd546ef13
# Project adapter: .github/workflow-adapter.json; source: scripts/workflow-project/roles.json
# Run workflow:generate explicitly; workflow:check never repairs output.
name: "Shared package quality"
on:
  workflow_call: {}
permissions:
  contents: "read"
  actions: "read"
jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 26
    runs-on: "ubuntu-latest"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: "${{ matrix.node }}"
          package-manager-cache: false
        name: "Shared: actions/setup-node@v6"
      -
        uses: "oven-sh/setup-bun@v2"
        with:
          bun-version: "1.4.0"
        name: "Shared: oven-sh/setup-bun@v2"
      -
        uses: "actions/cache/restore@v4"
        with:
          path: "~/.bun/install/cache"
          key: "${{ runner.os }}-${{ runner.arch }}-sitekit-bun-${{ hashFiles('bun.lock') }}"
          restore-keys: "${{ runner.os }}-${{ runner.arch }}-sitekit-bun-"
        id: "shared-cache-3"
        name: "Shared: actions/cache/restore@v4"
      -
        name: "Shared: Verify generated workflow supply"
        run: "node scripts/workflow-supply/public/conformance.mjs check --project-root ."
      -
        run: "bun install --frozen-lockfile --ignore-scripts"
        name: "Project: Run declared project check"
      -
        uses: "actions/cache/restore@v4"
        with:
          path: ".turbo/cache"
          key: "${{ runner.os }}-${{ runner.arch }}-sitekit-tasks-node${{ matrix.node }}-${{ github.sha }}"
          restore-keys: "${{ runner.os }}-${{ runner.arch }}-sitekit-tasks-node${{ matrix.node }}-"
        id: "shared-cache-5"
        name: "Shared: actions/cache/restore@v4"
      -
        name: "Project: Verify PR release impact records"
        if: "matrix.node == 24 && github.event_name == 'pull_request'"
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PR_BODY: "${{ github.event.pull_request.body }}"
        run: |
          git update-ref refs/heads/main "$BASE_SHA"
          bun run release:records --base "$BASE_SHA"
      -
        name: "Project: Prepare pinned quality tools"
        if: "matrix.node == 24"
        run: "bun run quality:setup"
      -
        name: "Project: Select from trusted successful main ancestor"
        id: "public-selection"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node scripts/workflow-supply/public/quality.mjs plan"
      -
        name: "Project: Run selected project verification"
        if: "matrix.node == 24"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "bun run quality:ci"
      -
        name: "Project: Verify Node 26 runtime compatibility"
        if: "matrix.node == 26"
        run: "bun run quality:ci"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
      -
        name: "Shared: Save successful download/task cache"
        if: "${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-cache-3.outputs.cache-hit != 'true' }}"
        uses: "actions/cache/save@v4"
        with:
          path: "~/.bun/install/cache"
          key: "${{ steps.shared-cache-3.outputs.cache-primary-key }}"
      -
        name: "Shared: Save successful download/task cache"
        if: "${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-cache-5.outputs.cache-hit != 'true' }}"
        uses: "actions/cache/save@v4"
        with:
          path: ".turbo/cache"
          key: "${{ steps.shared-cache-5.outputs.cache-primary-key }}"
      -
        name: "Shared: Record authoritative source evidence"
        if: "${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        env:
          PUBLIC_SOURCE_NODE: "${{ matrix.node }}"
        run: "node scripts/workflow-supply/public/quality.mjs record"
      -
        name: "Shared: Preserve source evidence"
        if: "${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        uses: "actions/upload-artifact@v7"
        with:
          name: "source-evidence-node${{ matrix.node }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".cache/public-quality/source.json"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 14
    permissions:
      contents: "read"
      actions: "read"
    name: "Verify packages (Node ${{ matrix.node }})"
